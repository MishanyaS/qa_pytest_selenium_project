name: QA Automation CI (pytest + Selenium)

on:
  push:
    branches:
      - main
      - master
      - develop
    
  pull_request:
    branches:
      - main
      - master
      - develop
    
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - unit
          - api
          - ui
      test_path:
        description: >
          Path to test file or directory.
          Leave empty to run selected suite.
        required: false
        default: ""
        type: string
      pytest_args:
        description: >
          Additional pytest arguments.
          Example:
          -m smoke
          -k post
          -x
          --maxfail=1
        required: false
        default: ""
        type: string
env:
  PYTHON_VERSION: "3.12"
  ALLURE_RESULTS: allure-results
  SCREENSHOTS_DIR: screenshots
  DOWNLOADS_DIR: downloads
  LOGS_DIR: logs
jobs:
  lint:
    name: Ruff • Black • mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Ruff
        run: |
          ruff check .
      - name: Black
        run: |
          black --check .
      - name: mypy
        run: |
          mypy .
  tests:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
    env:
      SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Create directories
        run: |
          mkdir -p $ALLURE_RESULTS
          mkdir -p $SCREENSHOTS_DIR
          mkdir -p $DOWNLOADS_DIR
          mkdir -p $LOGS_DIR
      - name: Build pytest command
        id: command
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SUITE="${{ github.event.inputs.suite }}"
            TEST_PATH="${{ github.event.inputs.test_path }}"
            EXTRA_ARGS="${{ github.event.inputs.pytest_args }}"
          else
            SUITE="all"
            TEST_PATH=""
            EXTRA_ARGS=""
          fi
          if [[ -n "$TEST_PATH" ]]; then
            TARGET="$TEST_PATH"
          else
            case "$SUITE" in
              unit)
                TARGET="tests/unit"
                ;;
              api)
                TARGET="tests/api"
                ;;
              ui)
                TARGET="tests/ui"
                ;;
              all)
                TARGET="tests"
                ;;
              *)
                TARGET="tests"
                ;;
            esac
          fi
          CMD="pytest $TARGET \
          -v \
          -n auto \
          --alluredir=$ALLURE_RESULTS \
          $EXTRA_ARGS"
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo ""
          echo "==================================="
          echo "Pytest command:"
          echo "$CMD"
          echo "==================================="
      - name: Run pytest
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ${{ steps.command.outputs.command }}
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 30
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: downloads
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Pytest Cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache
          if-no-files-found: ignore
          retention-days: 7