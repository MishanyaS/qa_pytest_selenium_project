name: QA Automation CI (pytest + Selenium)

on:
  push:
    branches:
      - main
      - master
      - develop
    
  pull_request:
    branches:
      - main
      - master
      - develop
    
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - unit
          - api
          - ui
      test_path:
        description: >
          Path to test file or directory.
          Leave empty to run selected suite.
        required: false
        default: ""
        type: string
      pytest_args:
        description: >
          Additional pytest arguments.
          Example:
          -m smoke
          -k post
          -x
          --maxfail=1
        required: false
        default: ""
        type: string
env:
  PYTHON_VERSION: "3.12"
  ALLURE_RESULTS: allure-results
  SCREENSHOTS_DIR: screenshots
  DOWNLOADS_DIR: downloads
  LOGS_DIR: logs
jobs:
  lint:
    name: Ruff • Black • mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Ruff
        run: |
          ruff check .
      - name: Black
        run: |
          black --check .
      - name: mypy
        run: |
          mypy .
  tests:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      selenium:
        image: selenium/standalone-chrome:4.46.0
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --health-cmd="curl -fs http://localhost:4444/status || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Create directories
        run: |
          mkdir -p $ALLURE_RESULTS
          mkdir -p $SCREENSHOTS_DIR
          mkdir -p $DOWNLOADS_DIR
          mkdir -p $LOGS_DIR
      - name: Wait for Selenium
        shell: bash
        run: |
          echo "Waiting for Selenium Server..."
          for i in {1..30}; do
            if curl -fs http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium is ready."
              exit 0
            fi

            echo "Attempt $i/30: Selenium is not ready yet..."
            sleep 2
          done
          echo "Selenium failed to start."
          exit 1
      - name: Show Docker containers
        if: failure()
        run: docker ps -a
      - name: Show Selenium Logs
        if: failure()
        run: |
          CONTAINER_ID=$(docker ps -aq --filter "ancestor=selenium/standalone-chrome:4.46.0")
          if [ -n "$CONTAINER_ID" ]; then
            docker logs "$CONTAINER_ID"
          else
            echo "Selenium container not found."
          fi
      - name: Show Selenium status
        if: failure()
        run: curl -v http://localhost:4444/status || true
      - name: Build pytest command
        id: command
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SUITE="${{ github.event.inputs.suite }}"
            TEST_PATH="${{ github.event.inputs.test_path }}"
            EXTRA_ARGS="${{ github.event.inputs.pytest_args }}"
          else
            SUITE="all"
            TEST_PATH=""
            EXTRA_ARGS=""
          fi
          if [[ -n "$TEST_PATH" ]]; then
            TARGET="$TEST_PATH"
          else
            case "$SUITE" in
              unit)
                TARGET="tests/unit"
                ;;
              api)
                TARGET="tests/api"
                ;;
              ui)
                TARGET="tests/ui"
                ;;
              all)
                TARGET="tests"
                ;;
              *)
                TARGET="tests"
                ;;
            esac
          fi
          CMD="pytest $TARGET \
          -v \
          -n auto \
          --alluredir=$ALLURE_RESULTS \
          $EXTRA_ARGS"
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo ""
          echo "==================================="
          echo "Pytest command:"
          echo "$CMD"
          echo "==================================="
      - name: Run pytest
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ${{ steps.command.outputs.command }}
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: downloads
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Pytest Cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache
          if-no-files-found: ignore
          retention-days: 7